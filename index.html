<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="세환이텍 AS">
  <meta name="theme-color" content="#ffffff">
  <title>세환이텍 AS 접수</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface2: #f0f1f3;
      --border: rgba(0,0,0,0.08);
      --border2: rgba(0,0,0,0.15);
      --text: #1a1a2e;
      --text2: rgba(26,26,46,0.55);
      --text3: rgba(26,26,46,0.35);
      --accent: #1a3a6b;
      --accent2: #2e6b2e;
      --accent-text: #ffffff;
      --success: #1a7a3a;
      --error: #c0392b;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow-x: hidden;
    }

    .status-bar-safe { height: env(safe-area-inset-top); background: var(--surface); }

    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      padding: 10px 16px 10px;
      border-bottom: 0.5px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }

    .header-left { display: flex; align-items: center; gap: 10px; }

    .header-logo {
      height: 36px; width: auto;
      object-fit: contain;
    }

    .header-texts h1 { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
    .header-texts p  { font-size: 11px; color: var(--text3); margin-top: 1px; }

    .menu-btn {
      width: 40px; height: 40px;
      background: var(--surface2);
      border: 0.5px solid var(--border);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      font-size: 20px; color: var(--text);
    }
    .menu-btn:active { background: #e0e2e6; }

    /* 드로어 */
    .drawer-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 100; opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: auto; }

    .drawer {
      position: fixed; top: 0; right: 0;
      width: 85%; max-width: 320px; height: 100%;
      background: var(--surface); z-index: 101;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
      display: flex; flex-direction: column;
      padding-top: env(safe-area-inset-top);
      box-shadow: -4px 0 24px rgba(0,0,0,0.08);
    }
    .drawer.open { transform: translateX(0); }

    .drawer-header {
      padding: 18px 20px 16px;
      border-bottom: 0.5px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .drawer-title { font-size: 16px; font-weight: 700; color: var(--text); }
    .drawer-close {
      width: 32px; height: 32px;
      background: var(--surface2); border: none; border-radius: 8px;
      color: var(--text2); font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    .drawer-body { flex: 1; overflow-y: auto; padding: 20px; }

    .drawer-section-label {
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.8px; color: var(--text3);
      text-transform: uppercase;
      margin-bottom: 10px; padding-left: 2px;
    }

    .setup-card {
      background: var(--surface2);
      border-radius: var(--radius);
      border: 0.5px solid var(--border);
      padding: 16px; margin-bottom: 20px;
    }
    .setup-title {
      font-size: 13px; font-weight: 700;
      color: var(--text2); margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .key-row { display: flex; gap: 8px; }
    .key-input {
      flex: 1; background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px; font-size: 13px;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text); outline: none;
    }
    .key-input::placeholder { color: var(--text3); }
    .key-input:focus { border-color: var(--accent); }
    .save-btn {
      padding: 10px 14px;
      background: var(--accent); border: none;
      border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 700;
      font-family: 'Noto Sans KR', sans-serif;
      color: #fff; cursor: pointer; white-space: nowrap;
    }
    .save-btn:active { opacity: 0.85; }
    .saved-tag {
      display: none; align-items: center; gap: 4px;
      font-size: 12px; color: var(--success); margin-top: 8px;
    }
    .saved-tag.show { display: flex; }

    .install-card {
      background: #eaf3ff;
      border: 0.5px solid #b8d4f0;
      border-radius: var(--radius);
      padding: 14px 16px; font-size: 13px;
      color: #1a3a6b; line-height: 1.7;
    }
    .install-card strong { color: #1a3a6b; font-weight: 700; }

    /* 메인 */
    .scroll-body {
      padding: 20px 16px;
      padding-bottom: calc(100px + env(safe-area-inset-bottom));
      max-width: 480px; margin: 0 auto;
    }

    .section-label {
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.8px; color: var(--text3);
      text-transform: uppercase;
      margin-bottom: 10px; padding-left: 4px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 0.5px solid var(--border);
      overflow: hidden; margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }

    .field-row {
      padding: 14px 16px;
      border-bottom: 0.5px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .field-row:last-child { border-bottom: none; }

    .field-icon {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }
    .fi-blue   { background: rgba(26,58,107,0.1); }
    .fi-green  { background: rgba(46,107,46,0.1); }
    .fi-orange { background: rgba(180,90,20,0.1); }
    .fi-purple { background: rgba(100,60,160,0.1); }

    .field-inner { flex: 1; min-width: 0; }
    .field-inner label {
      display: block; font-size: 11px; font-weight: 700;
      color: var(--text3); letter-spacing: 0.5px; margin-bottom: 3px;
    }
    .field-inner label .req { color: var(--error); margin-left: 2px; }
    .field-inner input {
      width: 100%; background: transparent;
      border: none; outline: none;
      font-size: 15px; font-family: 'Noto Sans KR', sans-serif;
      color: var(--text); padding: 0;
    }
    .field-inner input::placeholder { color: var(--text3); }

    .time-value { font-size: 15px; color: var(--text2); font-variant-numeric: tabular-nums; }
    .field-row-time { display: none !important; }

    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-top: 0.5px solid var(--border);
    }

    .btn-submit {
      width: 100%; padding: 16px;
      background: var(--accent); border: none;
      border-radius: var(--radius);
      font-size: 16px; font-weight: 700;
      font-family: 'Noto Sans KR', sans-serif;
      color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-submit:active { transform: scale(0.97); opacity: 0.9; }
    .btn-submit.loading { opacity: 0.5; pointer-events: none; }

    .reset-row { text-align: center; margin-top: 8px; }
    .reset-btn {
      background: none; border: none;
      font-size: 13px; color: var(--text3);
      cursor: pointer; font-family: 'Noto Sans KR', sans-serif; padding: 4px 8px;
    }

    .toast {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.85);
      background: var(--surface);
      border: 0.5px solid var(--border2);
      border-radius: 20px;
      padding: 28px 32px;
      font-size: 16px; font-weight: 700; color: var(--text);
      opacity: 0; transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
      pointer-events: none;
      text-align: center;
      z-index: 999;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      min-width: 220px;
    }
    .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .toast.error { border-color: var(--error); color: var(--error); background: #fff5f5; }
    .toast.success { border-color: var(--success); color: var(--success); background: #f0fdf4; }
    .toast .toast-icon { font-size: 36px; display: block; margin-bottom: 10px; }
  </style>
</head>

<script src="https://developers.kakao.com/sdk/js/kakao.min.js" onload="Kakao.init('6a93b0f4f60a8eb9dd13c91c587dc225')"></script>
<script>

  const sigunguData = {
    '서울특별시': ['강남구','강동구','강북구','강서구','관악구','광진구','구로구','금천구','노원구','도봉구','동대문구','동작구','마포구','서대문구','서초구','성동구','성북구','송파구','양천구','영등포구','용산구','은평구','종로구','중구','중랑구'],
    '부산광역시': ['강서구','금정구','기장군','남구','동구','동래구','부산진구','북구','사상구','사하구','서구','수영구','연제구','영도구','중구','해운대구'],
    '대구광역시': ['남구','달서구','달성군','동구','북구','서구','수성구','중구'],
    '인천광역시': ['강화군','계양구','남동구','동구','미추홀구','부평구','서구','연수구','옹진군','중구'],
    '광주광역시': ['광산구','남구','동구','북구','서구'],
    '대전광역시': ['대덕구','동구','서구','유성구','중구'],
    '울산광역시': ['남구','동구','북구','울주군','중구'],
    '세종특별자치시': ['세종시'],
    '경기도': ['가평군','고양시','과천시','광명시','광주시','구리시','군포시','김포시','남양주시','동두천시','부천시','성남시','수원시','시흥시','안산시','안성시','안양시','양주시','양평군','여주시','연천군','오산시','용인시','의왕시','의정부시','이천시','파주시','평택시','포천시','하남시','화성시'],
    '강원도': ['강릉시','고성군','동해시','삼척시','속초시','양구군','양양군','영월군','원주시','인제군','정선군','철원군','춘천시','태백시','평창군','홍천군','화천군','횡성군'],
    '충청북도': ['괴산군','단양군','보은군','영동군','옥천군','음성군','제천시','증평군','진천군','청주시','충주시'],
    '충청남도': ['공주시','금산군','논산시','당진시','보령시','부여군','서산시','서천군','아산시','예산군','천안시','청양군','태안군','홍성군','계룡시'],
    '전라북도': ['고창군','군산시','김제시','남원시','무주군','부안군','순창군','완주군','익산시','임실군','장수군','전주시','정읍시','진안군'],
    '전라남도': ['강진군','고흥군','곡성군','광양시','구례군','나주시','담양군','목포시','무안군','보성군','순천시','신안군','여수시','영광군','영암군','완도군','장성군','장흥군','진도군','함평군','해남군','화순군','목포시'],
    '경상북도': ['경산시','경주시','고령군','구미시','군위군','김천시','문경시','봉화군','상주시','성주군','안동시','영덕군','영양군','영주시','영천시','예천군','울릉군','울진군','의성군','청도군','청송군','칠곡군','포항시'],
    '경상남도': ['거제시','거창군','고성군','김해시','남해군','밀양시','사천시','산청군','양산시','의령군','진주시','창녕군','창원시','통영시','하동군','함안군','함양군','합천군'],
    '제주특별자치도': ['서귀포시','제주시']
  };

  function updateSigungu() {
    const sido = document.getElementById('sido').value;
    const sigungu = document.getElementById('sigungu');
    const label = document.getElementById('sigungu-label');
    sigungu.innerHTML = '<option value="">선택하세요</option>';
    if (!sido) return;
    const list = sigunguData[sido] || [];
    list.forEach(function(s) {
      const opt = document.createElement('option');
      opt.value = s; opt.textContent = s;
      sigungu.appendChild(opt);
    });
    // 특별시/광역시는 구, 나머지는 시/군
    const isMetro = ['서울특별시','부산광역시','대구광역시','인천광역시','광주광역시','대전광역시','울산광역시'].includes(sido);
    label.innerHTML = (isMetro ? '구 ' : '시/군 ') + '<span class="req">*</span>';
  }

  let savedKey = '6a93b0f4f60a8eb9dd13c91c587dc225';

  function openDrawer() {
    document.getElementById('drawer').classList.add('open');
    document.getElementById('overlay').classList.add('open');
    checkLoginStatus();
  }
  function closeDrawer() {
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  }

  function updateTime() {
    const now = new Date();
    document.getElementById('time-display').textContent = now.toLocaleString('ko-KR', {
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });
  }
  updateTime();
  setInterval(updateTime, 1000);

  document.getElementById('phone').addEventListener('input', function(e) {
    let v = e.target.value.replace(/\D/g, '');
    if (v.length <= 3) {}
    else if (v.length <= 7) v = v.slice(0,3) + '-' + v.slice(3);
    else v = v.slice(0,3) + '-' + v.slice(3,7) + '-' + v.slice(7,11);
    e.target.value = v;
  });

  function checkLoginStatus() {
    const token = Kakao.Auth.getAccessToken();
    if (token) {
      Kakao.API.request({
        url: '/v1/user/me',
        success: function(res) {
          const nickname = res.properties && res.properties.nickname ? res.properties.nickname : '카카오 사용자';
          document.getElementById('login-nickname').textContent = nickname;
          document.getElementById('login-info').style.display = 'block';
          document.getElementById('login-prompt').style.display = 'none';
        },
        fail: function() {
          document.getElementById('login-info').style.display = 'none';
          document.getElementById('login-prompt').style.display = 'block';
        }
      });
    } else {
      document.getElementById('login-info').style.display = 'none';
      document.getElementById('login-prompt').style.display = 'block';
    }
  }

  function kakaoLogin() {
    Kakao.Auth.login({
      scope: 'talk_message,profile_nickname',
      success: function() {
        showToast('로그인 완료!', 'success');
        checkLoginStatus();
      },
      fail: function() {
        showToast('로그인 실패', 'error');
      }
    });
  }

  function kakaoLogout() {
    Kakao.Auth.logout(function() {
      document.getElementById('login-info').style.display = 'none';
      document.getElementById('login-prompt').style.display = 'block';
      showToast('로그아웃 완료', 'success');
    });
  }

  function saveAppKey() {
    const key = document.getElementById('app-key').value.trim();
    if (!key) { showToast('앱 키를 입력해주세요', 'error'); return; }
    try {
      if (window.Kakao) {
        if (!Kakao.isInitialized()) Kakao.init(key);
        savedKey = key;
        document.getElementById('key-saved').classList.add('show');
        showToast('앱 키 저장 완료', 'success');
        closeDrawer();
      }
    } catch(e) {
      showToast('앱 키 오류. 다시 확인해주세요', 'error');
    }
  }

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
    t.innerHTML = '<span class="toast-icon">' + icon + '</span>' + msg;
    t.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => t.className = 'toast', 3000);
  }

  function sendKakaoMe() {
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const sido = document.getElementById('sido').value;
    const sigungu = document.getElementById('sigungu').value;
    const address = (sido + ' ' + sigungu).trim();
    const time = document.getElementById('time-display').textContent;

    if (!savedKey) { showToast('설정에서 카카오 앱 키를 먼저 저장해주세요', 'error'); return; }
    // 로그인 안된 경우 먼저 로그인
    if (!Kakao.Auth.getAccessToken()) {
      Kakao.Auth.login({
        scope: 'talk_message,profile_nickname',
        success: function() { sendKakaoMe(); },
        fail: function() { showToast('카카오 로그인 실패', 'error'); }
      });
      return;
    }
    if (!name)    { showToast('이름을 입력해주세요', 'error'); return; }
    if (!phone)   { showToast('연락처를 입력해주세요', 'error'); return; }
    if (!sido || !sigungu) { showToast('지역을 선택해주세요', 'error');return; }

    const text = '[세환이텍 AS 접수]\n\n👤 이름: ' + name + '\n📞 연락처: ' + phone + '\n📍 주소: ' + address + '\n🕐 접수 시간: ' + time;

    const btn = document.getElementById('send-btn');
    btn.classList.add('loading');
    btn.innerHTML = '<span>⏳</span> 전송 중...';

    const restore = () => {
      btn.classList.remove('loading');
      btn.innerHTML = '<span>💬</span> 접수';
    };

    try {
      Kakao.API.request({
        url: '/v2/api/talk/memo/default/send',
        data: {
          template_object: {
            object_type: 'text',
            text: text,
            link: { mobile_web_url: 'https://wkwkwkgn10-pixel.github.io/github.io/', web_url: 'https://wkwkwkgn10-pixel.github.io/github.io/' }
          }
        },
        success: function() { showToast('AS 접수 완료', 'success');
          restore();
          document.getElementById('name').value = '';
          document.getElementById('phone').value = '';
          document.getElementById('sido').value = '';
          document.getElementById('sigungu').innerHTML = '<option value="">시/도를 먼저 선택하세요</option>';
        },
        fail: function(err) {
          restore();
          if (err.code === -401) {
            Kakao.Auth.login({
              scope: 'talk_message,profile_nickname',
              success: function() { sendKakaoMe(); },
              fail: function() { showToast('카카오 로그인 실패', 'error'); }
            });
          } else {
            showToast('전송 실패: ' + (err.msg || '오류'), 'error');
          }
        }
      });
    } catch(e) {
      restore();
      showToast('오류 발생. 앱 키를 확인해주세요', 'error');
    }
  }

  function resetForm() {
    document.getElementById('name').value = '';
    document.getElementById('phone').value = '';
    document.getElementById('sido').value = '';
    document.getElementById('sigungu').innerHTML = '<option value="">시/도를 먼저 선택하세요</option>';
    showToast('초기화 완료');
  }
</script>
</body>
